
<div class="shell">
<header class="head" id="head">
  <div class="r1">
    <input class="title" id="nbtitle" type="text" aria-label="Notebook title" value="">
    <span class="save" id="save"></span>
    <button class="btn setbtnh" id="setbtn" type="button" title="Settings (⌘,): syllabus, writing, themes, highlight key, equations, zoom, library" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M21.2 12h-2.6M5.4 12H2.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8M18.5 18.5l-1.8-1.8M7.3 7.3L5.5 5.5"/></svg></button>
    <button class="btn" id="editbtn" hidden style="min-width:9.5em">Edit syllabus</button>
    <button class="btn mapbtn" id="mapbtn">Contents</button>
    <div class="tabs" role="group" aria-label="View">
      <button data-view="syl" aria-pressed="true">Syllabus</button>
      <button data-view="notes" class="doctab" aria-pressed="false">Notes</button>
      <button data-view="essay" class="doctab" aria-pressed="false">Essay</button>
      <button data-view="wc" aria-pressed="false">Works Cited</button>
    </div>
  </div>
    <div class="tb" id="tb" role="toolbar" aria-label="Formatting">
    <div class="tg">
      <button class="tbtn" id="tb-head" data-menu="head" title="Heading (or type # or ## and a space) · tag with a spec point" aria-label="Heading"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M18 5v14M6 12h12"/></svg><svg class="chev" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.8l3 3 3-3"/></svg></button>
      <button class="tbtn" id="tb-list" data-menu="list" title="Lists, quote, callouts and divider" aria-label="List"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.6" cy="6" r=".9" fill="currentColor"/><circle cx="4.6" cy="12" r=".9" fill="currentColor"/><circle cx="4.6" cy="18" r=".9" fill="currentColor"/></svg><svg class="chev" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.8l3 3 3-3"/></svg></button>
    </div>
    <div class="tg">
      <button class="tbtn letter" id="tb-b" data-cmd="bold" title="Bold (⌘B, or type **text**)" aria-label="Bold"><b>B</b></button>
      <button class="tbtn letter" id="tb-i" data-cmd="italic" title="Italic (⌘I, or type *text*)" aria-label="Italic"><i>I</i></button>
      <span class="split">
        <button class="tbtn hlb" id="tb-hl" data-cmd="hl" title="Highlight (or type ==text==)" aria-label="Highlight"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4.5l5 5-8.5 8.5H6v-5z"/><path d="M12 7l5 5"/></svg><span class="hlsw" id="hlsw"></span></button>
        <button class="tbtn chevb" data-menu="hl" title="Highlight colour" aria-label="Highlight colour"><svg class="chev" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.8l3 3 3-3"/></svg></button>
      </span>
    </div>
    <div class="tg">
      <button class="tbtn" data-menu="cmt" id="tb-cmt" title="Comment on the selected text (\u2325\u2318M)" aria-label="Comment"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5c4.7 0 8.5 2.9 8.5 6.5s-3.8 6.5-8.5 6.5c-1.1 0-2.1-.15-3-.45L4.8 19l1.3-3.6C4.5 14.2 3.5 12.7 3.5 11c0-3.6 3.8-6.5 8.5-6.5z"/><circle cx="8.5" cy="11" r=".9" fill="currentColor"/><circle cx="12" cy="11" r=".9" fill="currentColor"/><circle cx="15.5" cy="11" r=".9" fill="currentColor"/></svg><svg class="chev" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.8l3 3 3-3"/></svg></button>
    </div>
    <div class="tg">
      <button class="tbtn" id="tb-ins" data-menu="ins" title="Insert and more: image, table, link, footnote, contents, underline, check citations, folding…" aria-label="Insert"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13"/></svg><svg class="chev" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.8l3 3 3-3"/></svg></button>
    </div>
    <div class="tg citg">
      <button class="tbtn cite" data-cmd="cite" title="In-text citation" aria-label="Citation"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 17c0-4 1.5-7 4.5-9M5 17h3.5v-4H5M13 17c0-4 1.5-7 4.5-9M13 17h3.5v-4H13"/></svg></button>
      <button class="tbtn" data-cmd="sources" id="srcbtn" aria-pressed="false" title="Show or hide your Works Cited" aria-label="Works Cited"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.8C10.4 5.5 7.9 4.8 4 4.8v12.8c3.9 0 6.4.7 8 2 1.6-1.3 4.1-2 8-2V4.8c-3.9 0-6.4.7-8 2z"/><path d="M12 6.8v12.8"/></svg></button>
    </div>
    <div class="tg zoomg">
      <button class="tbtn" data-zoom="-1" title="Zoom out (⌘−)" aria-label="Zoom out"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></button>
      <button class="tbtn zlab" id="zlab" data-menu="zoom" title="Zoom" aria-label="Zoom level">100%</button>
      <button class="tbtn" data-zoom="1" title="Zoom in (⌘+)" aria-label="Zoom in"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12M12 6v12"/></svg></button>
    </div>
    <div class="tg focusg">
      <button class="tbtn" id="tb-focus" data-cmd="focus" aria-pressed="false" title="Focus: just your notes and this bar (⇧⌘F)" aria-label="Focus mode"><svg class="foff" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><svg class="fon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg></button>
    </div>
    <input type="file" id="mediain" accept="image/*" multiple hidden>
  </div>
  <div class="tbltab" id="tbltab" role="toolbar" aria-label="Table" hidden></div>
  <div class="citebar" id="citebar" role="region" aria-label="Citation check" hidden></div>
</header>
<div class="focustop" id="focustop" aria-hidden="true"><span id="focustitle"></span></div>
<div class="body" id="bodywrap">
  <nav class="side" id="side" aria-label="Syllabus map"></nav>
  <main id="main"></main>
  <aside class="refs" id="refs" hidden aria-label="Works cited"></aside>
  <aside class="cmts" id="cmts" hidden aria-label="Comments"></aside>
</div>
</div>
<button class="btn back" id="back" hidden>&#8592; Back to syllabus</button>
<div class="toast" id="toast" hidden></div>
